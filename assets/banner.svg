<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purple-glow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="pink-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Curve Gradients -->
    <linearGradient id="curve-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="curve-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="0" cy="0" r="1.5" fill="#334155" opacity="0.6" />
    </pattern>

    <!-- Filters -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Animations -->
    <style>
      @keyframes dashFlow {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-4deg); }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes handleRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes beaconRing {
        0% { r: 6; opacity: 1; stroke-width: 2; }
        100% { r: 24; opacity: 0; stroke-width: 0.5; }
      }

      .animated-curve-1 {
        stroke-dasharray: 800;
        animation: dashFlow 16s linear infinite;
      }
      .animated-curve-2 {
        stroke-dasharray: 600;
        animation: dashFlow 22s linear infinite reverse;
      }
      .floating-group-1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .floating-group-2 {
        animation: floatSlow2 9s ease-in-out infinite;
      }
      .pulsing-node {
        transform-origin: center;
        animation: pulseNode 3s ease-in-out infinite;
      }
      .beacon-circle {
        animation: beaconRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#cyan-glow)" />
  <rect width="100%" height="100%" fill="url(#purple-glow)" />
  <rect width="100%" height="100%" fill="url(#pink-glow)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Vector Graphics Art (Background / Midground) -->
  <g opacity="0.85">
    <!-- Dynamic Bezier Ribbon 1 -->
    <path class="animated-curve-1" d="M -50 320 C 250 380, 320 80, 600 140 C 880 200, 950 40, 1250 80" 
          fill="none" stroke="url(#curve-grad-1)" stroke-width="4" filter="url(#glow-blur)" />
    
    <!-- Dynamic Bezier Ribbon 2 -->
    <path class="animated-curve-2" d="M -50 100 C 220 20, 420 340, 750 290 C 1000 250, 1100 370, 1250 330" 
          fill="none" stroke="url(#curve-grad-2)" stroke-width="3" stroke-dasharray="8,6" opacity="0.7" />

    <!-- Vector Node Control Points & Handles (Left Cluster) -->
    <g class="floating-group-1" transform="translate(140, 90)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" class="beacon-circle" />
      <line x1="-45" y1="-25" x2="45" y2="25" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.75" />
      <line x1="0" y1="0" x2="-45" y2="-25" stroke="#06b6d4" stroke-width="1.5" />
      <line x1="0" y1="0" x2="45" y2="25" stroke="#06b6d4" stroke-width="1.5" />
      <!-- Tangent Handle Nodes -->
      <circle cx="-45" cy="-25" r="4.5" fill="#38bdf8" />
      <circle cx="45" cy="25" r="4.5" fill="#38bdf8" />
      <!-- Main Vector Anchor Point -->
      <rect x="-6" y="-6" width="12" height="12" fill="#0284c7" stroke="#e0f2fe" stroke-width="2" />
    </g>

    <!-- Vector Node Control Points & Handles (Right Cluster) -->
    <g class="floating-group-2" transform="translate(1060, 290)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#d946ef" class="beacon-circle" />
      <line x1="-50" y1="30" x2="50" y2="-30" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.75" />
      <!-- Tangent Handle Nodes -->
      <circle cx="-50" cy="30" r="4.5" fill="#f472b6" />
      <circle cx="50" cy="-30" r="4.5" fill="#f472b6" />
      <!-- Main Vector Anchor Point -->
      <rect x="-6" y="-6" width="12" height="12" fill="#a21caf" stroke="#fdf4ff" stroke-width="2" />
    </g>

    <!-- Procedural Node Geometry (Center Right) -->
    <g class="floating-group-1" transform="translate(1020, 110)">
      <polygon points="0,-28 24,14 -24,14" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.5" />
      <circle cx="0" cy="-28" r="3.5" fill="#818cf8" />
      <circle cx="24" cy="14" r="3.5" fill="#818cf8" />
      <circle cx="-24" cy="14" r="3.5" fill="#818cf8" />
      <circle cx="0" cy="0" r="2" fill="#c7d2fe" />
    </g>

    <!-- Pen Tool Icon Accent (Top Left) -->
    <g transform="translate(70, 260) rotate(-35)" opacity="0.6">
      <path d="M0,0 L12,-35 L24,0 L16,5 L12,40 L8,5 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <circle cx="12" cy="0" r="2" fill="#38bdf8" />
    </g>
  </g>

  <!-- Foreground Backdrop Panel for Pristine Legibility -->
  <rect x="100" y="55" width="1000" height="290" rx="20" 
        fill="#0f172a" fill-opacity="0.65" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" 
        filter="url(#soft-shadow)" />

  <!-- Foreground Content Layer -->
  <g id="foreground-content">
    <!-- Top Category Eyebrow Pill -->
    <g transform="translate(600, 105)">
      <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="-145" cy="0" r="4.5" fill="#22c55e" class="pulsing-node" />
      <text x="8" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
            font-size="12.5" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">
        CURATED AWESOME ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="172" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5"
          fill="url(#text-grad)" filter="url(#soft-shadow)">
      Awesome Web Vector Graphics Editor
    </text>

    <!-- Subtitle -->
    <text x="600" y="218" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="16.5" font-weight="400" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.2">
      Curated List of SaaS Platforms &amp; Open-Source Projects for Browser-Native Vector Design
    </text>

    <!-- Feature Tag Pills in Foreground -->
    <g transform="translate(600, 280)">
      <!-- Pill 1: SVG 2.0 Native -->
      <g transform="translate(-360, 0)">
        <rect x="0" y="-16" width="165" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
        <text x="82.5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">
          🎨 SVG-Native Editing
        </text>
      </g>

      <!-- Pill 2: Wasm & WebGPU -->
      <g transform="translate(-180, 0)">
        <rect x="0" y="-16" width="165" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
        <text x="82.5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">
          ⚡ Wasm &amp; WebGPU
        </text>
      </g>

      <!-- Pill 3: Procedural Node Engines -->
      <g transform="translate(0, 0)">
        <rect x="0" y="-16" width="175" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
        <text x="87.5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="12" font-weight="600" fill="#e9d5ff" text-anchor="middle">
          💎 Procedural Engines
        </text>
      </g>

      <!-- Pill 4: Self-Hosted & SaaS -->
      <g transform="translate(190, 0)">
        <rect x="0" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#f472b6" stroke-width="1" />
        <text x="85" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="12" font-weight="600" fill="#fbcfe8" text-anchor="middle">
          🌐 Self-Hosted &amp; SaaS
        </text>
      </g>
    </g>
  </g>
</svg>
